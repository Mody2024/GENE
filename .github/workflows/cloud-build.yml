name: GENE Cloud Binary Build
run-name: ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Unique GENE build identifier
        required: true
        type: string
      source_ref:
        description: Encrypted source branch
        required: true
        type: string
      targets:
        description: Binary targets to build
        required: true
        type: choice
        options: [both, windows, android]
permissions:
  contents: write
  actions: read
concurrency:
  group: gene-cloud-build-${{ inputs.build_id }}
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ inputs.targets == 'both' || inputs.targets == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      download_url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source-input
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decrypt and prepare project
        shell: pwsh
        env:
          GENE_BUILD_ENCRYPTION_KEY: ${{ secrets.GENE_BUILD_ENCRYPTION_KEY }}
        run: |
          node scripts/cloud-build.mjs unpack "source-input/.gene-builds/${{ inputs.build_id }}.enc" web
          $meta = Get-Content web/gene-build.json -Raw | ConvertFrom-Json
          node scripts/cloud-build.mjs prepare-electron web desktop "$($meta.title)"
      - name: Compile Windows installer
        shell: pwsh
        run: |
          Push-Location desktop
          npm install --no-audit --no-fund
          npm run dist:win
          Pop-Location
          $exe = Get-ChildItem desktop/dist -File -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "electron-builder finished without an EXE installer." }
          New-Item -ItemType Directory -Force build-output | Out-Null
          Copy-Item $exe.FullName "build-output/GENE-${{ inputs.build_id }}-Setup.exe"
      - name: Upload real EXE to download storage
        id: upload
        shell: pwsh
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --workspaces=false --no-save --no-audit --no-fund @vercel/blob
          node scripts/upload-cloud-output.mjs "build-output/GENE-${{ inputs.build_id }}-Setup.exe" "${{ inputs.build_id }}" "GENE-${{ inputs.build_id }}-Setup.exe" "application/vnd.microsoft.portable-executable"
  android:
    if: ${{ inputs.targets == 'both' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      download_url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source-input
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Decrypt and prepare project
        env:
          GENE_BUILD_ENCRYPTION_KEY: ${{ secrets.GENE_BUILD_ENCRYPTION_KEY }}
        run: |
          node scripts/cloud-build.mjs unpack "source-input/.gene-builds/${{ inputs.build_id }}.enc" web
          META_TITLE="$(node -p "require('./web/gene-build.json').title")"
          META_ID="$(node -p "require('./web/gene-build.json').projectId")"
          node scripts/cloud-build.mjs prepare-android web android-wrapper "$META_TITLE" "$META_ID"
      - name: Compile installable Android APK
        run: |
          cd android-wrapper
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cd ../..
          mkdir -p build-output
          cp android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk "build-output/GENE-${{ inputs.build_id }}-debug.apk"
      - name: Upload real APK to download storage
        id: upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --no-save --no-audit --no-fund @vercel/blob
          node scripts/upload-cloud-output.mjs "build-output/GENE-${{ inputs.build_id }}-debug.apk" "${{ inputs.build_id }}" "GENE-${{ inputs.build_id }}-debug.apk" "application/vnd.android.package-archive"
  publish-result:
    if: always()
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: true
      - name: Publish build result for GENE
        uses: actions/github-script@v7
        env:
          BUILD_ID: ${{ inputs.build_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_TARGETS: ${{ inputs.targets }}
          WINDOWS_STATE: ${{ needs.windows.result }}
          WINDOWS_URL: ${{ needs.windows.outputs.download_url }}
          ANDROID_STATE: ${{ needs.android.result }}
          ANDROID_URL: ${{ needs.android.outputs.download_url }}
        with:
          script: |
            const fs = require('fs');
            const buildId = process.env.BUILD_ID;
            const targets = {
              windows: { status: process.env.WINDOWS_STATE, url: process.env.WINDOWS_URL || null, filename: 'GENE-' + buildId + '-Setup.exe' },
              android: { status: process.env.ANDROID_STATE, url: process.env.ANDROID_URL || null, filename: 'GENE-' + buildId + '-debug.apk', signing: 'debug' }
            };
            const requested = process.env.REQUESTED_TARGETS;
            if (requested === 'windows') delete targets.android;
            if (requested === 'android') delete targets.windows;
            const states = Object.values(targets).map(x => x.status);
            const successful = Object.values(targets).filter(x => x.status === 'success' && x.url).length;
            const state = successful === states.length ? 'success' : successful ? 'partial' : 'failed';
            const report = { buildId, state, targets, runUrl: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId, completedAt: new Date().toISOString(), note: 'Android output is a debug-signed APK suitable for direct device installation, not a Play Store release.' };
            const content = Buffer.from(JSON.stringify(report, null, 2)).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: '.gene-builds/' + buildId + '.result.json',
              message: 'Record cloud build result ' + buildId,
              branch: process.env.SOURCE_REF,
              content
            });
